name: Background refresh
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtside-background-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-background.js
        env:
          COURTSIDE_BASE_URL: ${{ vars.COURTSIDE_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
